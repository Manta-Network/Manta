name: Build Substrate Template

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-final
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          
      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
        
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            template-final/target/
          key: ${{ runner.os }}-cargo-template-${{ hashFiles('template-final/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-template-
          
      - name: Check template compiles
        run: cargo check --release
        
      - name: Build node binary
        run: cargo build --release
        
      - name: Upload node binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: chameleon-node
          path: template-final/target/release/node-template
          retention-days: 7
