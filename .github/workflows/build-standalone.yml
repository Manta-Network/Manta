name: Build Substrate Template

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  check-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-final
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rust-src
      
      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev cmake
        
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            template-final/target/
          key: ${{ runner.os }}-cargo-template-${{ hashFiles('template-final/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-template-
          
      - name: Check Template Compiles
        run: cargo check --release
        
      - name: Build Template
        run: cargo build --release
        
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: node-template
          path: template-final/target/release/solochain-template-node
