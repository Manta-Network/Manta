name: Build Chameleon Node (Template Migration)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: template-migration

jobs:
  check-pallets:
    name: Check Custom Pallets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            template-migration/target/
          key: ${{ runner.os }}-cargo-template-check-${{ hashFiles('template-migration/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-template-check-
      
      - name: Check MEV Pallet
        run: cargo check -p pallet-chameleon-mev
      
      - name: Check pDEX Pallet
        run: cargo check -p pallet-chameleon-pdex
      
      - name: Check Bridge Pallet
        run: cargo check -p pallet-chameleon-bridge
      
      - name: Check Staking Pallet
        run: cargo check -p pallet-chameleon-staking

  build-runtime:
    name: Build Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check-pallets
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev cmake
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            template-migration/target/
          key: ${{ runner.os }}-cargo-template-runtime-${{ hashFiles('template-migration/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-template-runtime-
      
      - name: Build Runtime
        run: cargo build -p chameleon-runtime --release
      
      - name: Upload Runtime WASM
        uses: actions/upload-artifact@v4
        with:
          name: runtime-wasm
          path: template-migration/target/release/wbuild/chameleon-runtime/
          retention-days: 7

  build-node:
    name: Build Node Binary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-runtime
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev cmake
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            template-migration/target/
          key: ${{ runner.os }}-cargo-template-node-${{ hashFiles('template-migration/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-template-node-
      
      - name: Build Node Binary
        run: cargo build -p chameleon-node --release
      
      - name: Upload Node Binary
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-node-${{ github.sha }}
          path: template-migration/target/release/chameleon-node
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-node
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Node Binary
        uses: actions/download-artifact@v4
        with:
          name: chameleon-node-${{ github.sha }}
          path: ./release/
      
      - name: Download Runtime WASM
        uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: ./release/wasm/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/chameleon-node
            release/wasm/chameleon_runtime.compact.compressed.wasm
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
