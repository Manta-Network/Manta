name: Build and Deploy Chameleon Network

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deployment environment'
        required: true
        default: 'devnet'
        type: choice
        options:
          - devnet
          - testnet
          - mainnet
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build and test the node
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
          components: rustfmt, clippy
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            curl \
            libssl-dev \
            llvm \
            libudev-dev \
            make \
            protobuf-compiler \
            pkg-config
      
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      
      - name: Check code formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo test --workspace --release --verbose
      
      - name: Build node binary
        run: |
          cargo build --release --target ${{ matrix.target }} --bin manta
      
      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/manta chameleon-node-${{ matrix.target }}
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: chameleon-node-${{ matrix.target }}
          path: chameleon-node-${{ matrix.target }}
          retention-days: 30
  
  # Create GitHub release on tag push
  create-release:
    name: Create Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: release_notes
        run: |
          # Extract changelog for this version
          if [[ -f CHANGELOG.md ]]; then
            # Try to extract changelog section for this version
            awk '/^## \['${{ steps.extract_version.outputs.version }}'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
            
            # If no specific version found, use a default message
            if [[ ! -s release_notes.md ]]; then
              echo "Release ${{ steps.extract_version.outputs.version }} of Chameleon Network" > release_notes.md
              echo "" >> release_notes.md
              echo "### Changes" >> release_notes.md
              echo "- See commit history for detailed changes" >> release_notes.md
            fi
          else
            echo "Release ${{ steps.extract_version.outputs.version }} of Chameleon Network" > release_notes.md
          fi
          
          # Add download instructions
          cat >> release_notes.md << EOF
          
          ### Download
          
          Download the appropriate binary for your system:
          - **Linux x86_64**: chameleon-node-x86_64-unknown-linux-gnu
          - **Linux ARM64**: chameleon-node-aarch64-unknown-linux-gnu
          
          ### Installation
          
          \`\`\`bash
          # Download binary (replace with appropriate architecture)
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.extract_version.outputs.version }}/chameleon-node-x86_64-unknown-linux-gnu
          
          # Make executable and install
          chmod +x chameleon-node-x86_64-unknown-linux-gnu
          sudo mv chameleon-node-x86_64-unknown-linux-gnu /usr/local/bin/chameleon-node
          
          # Verify installation
          chameleon-node --version
          \`\`\`
          
          ### Deployment
          
          Use the deployment scripts in the `devnet/deploy/` directory to deploy validators to AWS or other cloud providers.
          EOF
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          release_name: Chameleon Network ${{ steps.extract_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.extract_version.outputs.version, 'alpha') || contains(steps.extract_version.outputs.version, 'beta') || contains(steps.extract_version.outputs.version, 'rc') }}
  
  # Upload release assets
  upload-assets:
    name: Upload Release Assets
    needs: [build-and-test, create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v3
        with:
          name: chameleon-node-${{ matrix.target }}
      
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./chameleon-node-${{ matrix.target }}
          asset_name: chameleon-node-${{ matrix.target }}
          asset_content_type: application/octet-stream
  
  # Deploy to AWS (only on main branch or manual trigger)
  deploy-aws:
    name: Deploy to AWS
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    environment: ${{ github.event.inputs.deploy_environment || 'devnet' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
      
      - name: Set deployment environment
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "DEPLOY_ENV=${{ github.event.inputs.deploy_environment }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=devnet" >> $GITHUB_ENV
          fi
      
      - name: Validate AWS access
        run: |
          aws sts get-caller-identity
          echo "AWS access validated"
      
      - name: Check existing deployment
        id: check_deployment
        run: |
          cd devnet/deploy
          
          # Check if deployment log exists
          if [[ -f "deployment-${DEPLOY_ENV}.csv" ]]; then
            echo "existing_deployment=true" >> $GITHUB_OUTPUT
            echo "Found existing deployment for ${DEPLOY_ENV}"
            cat "deployment-${DEPLOY_ENV}.csv"
          else
            echo "existing_deployment=false" >> $GITHUB_OUTPUT
            echo "No existing deployment found for ${DEPLOY_ENV}"
          fi
      
      - name: Deploy new infrastructure
        if: steps.check_deployment.outputs.existing_deployment == 'false'
        run: |
          cd devnet/deploy
          chmod +x aws-deployment.sh
          chmod +x scripts/validator-init.sh
          
          echo "Deploying new ${DEPLOY_ENV} infrastructure..."
          ./aws-deployment.sh "${DEPLOY_ENV}" deploy
      
      - name: Update existing infrastructure
        if: steps.check_deployment.outputs.existing_deployment == 'true'
        run: |
          cd devnet/deploy
          
          echo "Updating existing ${DEPLOY_ENV} infrastructure..."
          
          # For now, just verify the deployment
          # In the future, this could trigger rolling updates
          ./aws-deployment.sh "${DEPLOY_ENV}" verify
      
      - name: Verify deployment
        run: |
          cd devnet/deploy
          
          echo "Verifying ${DEPLOY_ENV} deployment..."
          ./aws-deployment.sh "${DEPLOY_ENV}" verify
          
          # Generate connection info
          ./aws-deployment.sh "${DEPLOY_ENV}" info
      
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-info-${{ env.DEPLOY_ENV }}
          path: |
            devnet/deploy/deployment-${{ env.DEPLOY_ENV }}.csv
            devnet/deploy/connection-info-${{ env.DEPLOY_ENV }}.md
            devnet/deploy/chameleon-*.pem
          retention-days: 90
      
      - name: Post deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${DEPLOY_ENV}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f "devnet/deploy/connection-info-${DEPLOY_ENV}.md" ]]; then
            echo "### Connection Information" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "devnet/deploy/connection-info-${DEPLOY_ENV}.md" >> $GITHUB_STEP_SUMMARY
          fi
  
  # Security scan (optional, runs on PRs and main)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Cargo Audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
  
  # Notification job (runs after all other jobs)
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-aws]
    if: always()
    
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.build-and-test.result }}" == "success" ]]; then
            if [[ "${{ needs.deploy-aws.result }}" == "success" || "${{ needs.deploy-aws.result }}" == "skipped" ]]; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "message=Build and deployment completed successfully" >> $GITHUB_OUTPUT
            else
              echo "status=failure" >> $GITHUB_OUTPUT
              echo "message=Build succeeded but deployment failed" >> $GITHUB_OUTPUT
            fi
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Build failed" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          channel: '#chameleon-dev'
          username: 'GitHub Actions'
          icon_emoji: ':chameleon:'
          title: 'Chameleon Network CI/CD'
          message: |
            ${{ steps.status.outputs.message }}
            
            **Repository**: ${{ github.repository }}
            **Branch/Tag**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            
            **Build**: ${{ needs.build-and-test.result }}
            **Deploy**: ${{ needs.deploy-aws.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Create issue on failure
        if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/github-script@v6
        with:
          script: |
            const title = `CI/CD Pipeline Failed - ${context.ref}`;
            const body = `
            ## Pipeline Failure Report
            
            **Repository**: ${context.repo.owner}/${context.repo.repo}
            **Branch/Tag**: ${context.ref}
            **Commit**: ${context.sha}
            **Run ID**: ${context.runId}
            **Workflow**: ${context.workflow}
            
            ### Job Results
            - **Build and Test**: ${{ needs.build-and-test.result }}
            - **Deploy AWS**: ${{ needs.deploy-aws.result }}
            
            ### Action Required
            Please investigate the failure and take appropriate action.
            
            **Workflow Run**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'ci/cd', 'high-priority']
            });