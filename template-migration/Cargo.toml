[workspace]
resolver = "2"

members = [
    "node",
    "runtime",
    "pallets/chameleon-mev",
    "pallets/chameleon-pdex",
    "pallets/chameleon-bridge",
    "pallets/chameleon-staking",
]

[workspace.package]
authors = ["Chameleon Network"]
edition = "2021"
license = "MIT"
repository = "https://github.com/chmldev/chameleon-network"

[workspace.dependencies]
# Parity codec
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"] }

# Substrate primitives
sp-api = { version = "34.0.0", default-features = false }
sp-block-builder = { version = "34.0.0", default-features = false }
sp-consensus-aura = { version = "0.40.0", default-features = false }
sp-consensus-grandpa = { version = "21.0.0", default-features = false }
sp-core = { version = "34.0.0", default-features = false }
sp-genesis-builder = { version = "0.15.1", default-features = false }
sp-inherents = { version = "34.0.0", default-features = false }
sp-io = { version = "38.0.0", default-features = false }
sp-runtime = { version = "39.0.2", default-features = false }
sp-session = { version = "35.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
sp-storage = { version = "21.0.0", default-features = false }
sp-transaction-pool = { version = "34.0.0", default-features = false }
sp-version = { version = "37.0.0", default-features = false }
sp-blockchain = { version = "36.0.0" }
sp-timestamp = { version = "34.0.0" }
sp-keyring = { version = "39.0.0" }
sp-offchain = { version = "34.0.0", default-features = false }
sp-consensus = { version = "0.40.0" }

# Frame dependencies
frame-benchmarking = { version = "36.0.0", default-features = false }
frame-executive = { version = "36.0.0", default-features = false }
frame-support = { version = "36.0.0", default-features = false }
frame-system = { version = "36.1.0", default-features = false }
frame-system-benchmarking = { version = "36.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "34.0.0", default-features = false }
frame-try-runtime = { version = "0.42.0", default-features = false }

# Pallets
pallet-aura = { version = "35.0.0", default-features = false }
pallet-assets = { version = "37.0.0", default-features = false }
pallet-balances = { version = "37.0.0", default-features = false }
pallet-grandpa = { version = "36.0.0", default-features = false }
pallet-sudo = { version = "36.0.0", default-features = false }
pallet-timestamp = { version = "35.0.0", default-features = false }
pallet-transaction-payment = { version = "36.0.0", default-features = false }
pallet-transaction-payment-rpc = { version = "38.0.0" }
pallet-transaction-payment-rpc-runtime-api = { version = "36.0.0", default-features = false }

# Substrate client
sc-basic-authorship = { version = "0.42.0" }
sc-cli = { version = "0.44.0" }
sc-client-api = { version = "36.0.0" }
sc-consensus = { version = "0.41.0" }
sc-consensus-aura = { version = "0.42.0" }
sc-consensus-grandpa = { version = "0.27.0" }
sc-executor = { version = "0.40.1" }
sc-network = { version = "0.42.0" }
sc-network-sync = { version = "0.41.0" }
sc-offchain = { version = "37.0.0" }
sc-rpc = { version = "37.0.0" }
sc-rpc-api = { version = "0.41.0" }
sc-service = { version = "0.43.0" }
sc-telemetry = { version = "22.0.0" }
sc-transaction-pool = { version = "36.0.0" }
sc-transaction-pool-api = { version = "36.0.0" }
substrate-frame-rpc-system = { version = "36.0.0" }

# RPC
jsonrpsee = { version = "0.24", features = ["server"] }

# Build dependencies
substrate-build-script-utils = { version = "11.0.0" }
substrate-wasm-builder = { version = "24.0.1" }

# Other
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3" }
log = { version = "0.4", default-features = false }

# Chameleon custom pallets
pallet-chameleon-mev = { path = "pallets/chameleon-mev", default-features = false }
pallet-chameleon-pdex = { path = "pallets/chameleon-pdex", default-features = false }
pallet-chameleon-bridge = { path = "pallets/chameleon-bridge", default-features = false }
pallet-chameleon-staking = { path = "pallets/chameleon-staking", default-features = false }

# Pallet dependencies
sha3 = { version = "0.10", default-features = false }

[profile.release]
panic = "unwind"
opt-level = 3

[profile.production]
inherits = "release"
lto = true
codegen-units = 1
