[workspace]
resolver = "2"

members = [
    "node",
    "runtime",
    "pallets/chameleon-mev",
    "pallets/chameleon-pdex",
    "pallets/chameleon-bridge",
    "pallets/chameleon-staking",
]

[workspace.package]
authors = ["Chameleon Network"]
edition = "2021"
license = "MIT"
repository = "https://github.com/chmldev/chameleon-network"

[workspace.dependencies]
# Parity codec
codec = { package = "parity-scale-codec", version = "3.6", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }

# Substrate primitives (v30-34 range - actually published)
sp-api = { version = "30", default-features = false }
sp-block-builder = { version = "30", default-features = false }
sp-consensus-aura = { version = "0.36", default-features = false }
sp-consensus-grandpa = { version = "17", default-features = false }
sp-core = { version = "31", default-features = false }
sp-genesis-builder = { version = "0.11", default-features = false }
sp-inherents = { version = "30", default-features = false }
sp-io = { version = "33", default-features = false }
sp-runtime = { version = "34", default-features = false }
sp-session = { version = "31", default-features = false }
sp-std = { version = "14", default-features = false }
sp-storage = { version = "20", default-features = false }
sp-transaction-pool = { version = "30", default-features = false }
sp-version = { version = "32", default-features = false }
sp-blockchain = "31"
sp-timestamp = "30"
sp-keyring = "34"
sp-offchain = { version = "30", default-features = false }
sp-consensus = "0.36"

# Frame dependencies (v31-32 range - actually published)
frame-benchmarking = { version = "31", default-features = false }
frame-executive = { version = "31", default-features = false }
frame-support = { version = "31", default-features = false }
frame-system = { version = "31", default-features = false }
frame-system-benchmarking = { version = "31", default-features = false }
frame-system-rpc-runtime-api = { version = "30", default-features = false }
frame-try-runtime = { version = "0.37", default-features = false }

# Pallets (v30-32 range - actually published)
pallet-aura = { version = "30", default-features = false }
pallet-assets = { version = "32", default-features = false }
pallet-balances = { version = "31", default-features = false }
pallet-grandpa = { version = "31", default-features = false }
pallet-sudo = { version = "31", default-features = false }
pallet-timestamp = { version = "30", default-features = false }
pallet-transaction-payment = { version = "31", default-features = false }
pallet-transaction-payment-rpc = "33"
pallet-transaction-payment-rpc-runtime-api = { version = "31", default-features = false }

# Substrate client (v0.40-0.42 range - actually published)
sc-basic-authorship = "0.40"
sc-cli = "0.40"
sc-client-api = "31"
sc-consensus = "0.37"
sc-consensus-aura = "0.38"
sc-consensus-grandpa = "0.23"
sc-executor = "0.35"
sc-network = "0.38"
sc-network-sync = "0.37"
sc-offchain = "32"
sc-rpc = "32"
sc-rpc-api = "0.37"
sc-service = "0.39"
sc-telemetry = "18"
sc-transaction-pool = "31"
sc-transaction-pool-api = "31"
substrate-frame-rpc-system = "31"

# RPC
jsonrpsee = { version = "0.22", features = ["server"] }

# Build dependencies
substrate-build-script-utils = "11"
substrate-wasm-builder = "20"

# Other
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
log = { version = "0.4", default-features = false }

# Chameleon custom pallets
pallet-chameleon-mev = { path = "pallets/chameleon-mev", default-features = false }
pallet-chameleon-pdex = { path = "pallets/chameleon-pdex", default-features = false }
pallet-chameleon-bridge = { path = "pallets/chameleon-bridge", default-features = false }
pallet-chameleon-staking = { path = "pallets/chameleon-staking", default-features = false }

# Pallet dependencies
sha3 = { version = "0.10", default-features = false }

[profile.release]
panic = "unwind"
opt-level = 3

[profile.production]
inherits = "release"
lto = true
codegen-units = 1
