[package]
name = "chameleon-node"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Chameleon Network standalone node - Privacy blockchain with MEV protection"
license = "GPL-3.0"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"

# Substrate Client (v0.33-0.36 range - edition 2021)
sc-cli = "0.36"
sc-executor = "0.32"
sc-service = "0.35"
sc-telemetry = "15"
sc-transaction-pool = "28"
sc-transaction-pool-api = "28"
sc-consensus-aura = "0.34"
sc-consensus = "0.33"
sc-consensus-grandpa = "0.19"
sc-client-api = "28"
sc-rpc-api = "0.33"
sc-basic-authorship = "0.34"
sc-offchain = "29"
sc-network = "0.34"
sc-network-sync = "0.33"

# Substrate Primitives (v26-31 range - edition 2021)
sp-runtime = "31"
sp-io = "30"
sp-core = "28"
sp-session = "27"
sp-consensus-aura = "0.32"
sp-consensus-grandpa = "13"
sp-inherents = "26"
sp-timestamp = "26"
sp-blockchain = "28"
sp-block-builder = "26"
sp-keyring = "31"
sp-api = "26"
sp-consensus = "0.32"

# Frame (v28 - edition 2021)
frame-system = "28"
frame-support = "28"
pallet-transaction-payment = { version = "28", default-features = false }

# RPC
jsonrpsee = { version = "0.16", features = ["server"] }
sc-rpc = "29"
substrate-frame-rpc-system = "28"
pallet-transaction-payment-rpc = "30"

# Runtime
chameleon-runtime = { path = "../runtime-standalone" }

[build-dependencies]
substrate-build-script-utils = "11"

[features]
default = []
runtime-benchmarks = [
    "chameleon-runtime/runtime-benchmarks",
]
