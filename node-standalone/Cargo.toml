[package]
name = "chameleon-node"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Chameleon Network standalone node - Privacy blockchain with MEV protection"
license = "GPL-3.0"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"

# Substrate Client
sc-cli = "0.55"
sc-executor = "0.45"
sc-service = "0.54"
sc-telemetry = "30"
sc-transaction-pool = "42"
sc-transaction-pool-api = "42"
sc-consensus-aura = "0.53"
sc-consensus = "0.47"
sc-consensus-grandpa = "0.38"
sc-client-api = "42"
sc-rpc-api = "0.52"
sc-basic-authorship = "0.52"
sc-offchain = "48"
sc-network = "0.53"
sc-network-sync = "0.52"

# Substrate Primitives
sp-runtime = "44"
sp-io = "43"
sp-core = "38"
sp-session = "41"
sp-consensus-aura = "0.45"
sp-consensus-grandpa = "26"
sp-inherents = "39"
sp-timestamp = "39"
sp-blockchain = "42"
sp-block-builder = "39"
sp-keyring = "44"
sp-api = "39"
sp-consensus = "0.45"

# Frame
frame-system = "43"
frame-support = "43"
pallet-transaction-payment = { version = "43", default-features = false }

# RPC
jsonrpsee = { version = "0.24", features = ["server"] }
sc-rpc = "48"
substrate-frame-rpc-system = "47"
pallet-transaction-payment-rpc = "46"

# Runtime
chameleon-runtime = { path = "../runtime-standalone" }

[build-dependencies]
substrate-build-script-utils = "11"

[features]
default = []
runtime-benchmarks = [
    "chameleon-runtime/runtime-benchmarks",
]
