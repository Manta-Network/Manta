[package]
name = "chameleon-node"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Chameleon Network standalone node - Privacy blockchain with MEV protection"
license = "GPL-3.0"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"

# Substrate Client
sc-cli = "0.44"
sc-executor = "0.40"
sc-service = "0.43"
sc-telemetry = "22"
sc-transaction-pool = "36"
sc-transaction-pool-api = "36"
sc-consensus-aura = "0.42"
sc-consensus = "0.41"
sc-consensus-grandpa = "0.27"
sc-client-api = "36"
sc-rpc-api = "0.41"
sc-basic-authorship = "0.42"
sc-offchain = "37"
sc-network = "0.42"
sc-network-sync = "0.41"

# Substrate Primitives
sp-runtime = "39"
sp-io = "38"
sp-core = "34"
sp-session = "35"
sp-consensus-aura = "0.40"
sp-consensus-grandpa = "21"
sp-inherents = "34"
sp-timestamp = "34"
sp-blockchain = "36"
sp-block-builder = "34"
sp-keyring = "39"
sp-api = "34"
sp-consensus = "0.40"

# Frame
frame-system = "36"
frame-support = "36"
pallet-transaction-payment = { version = "36", default-features = false }

# RPC
jsonrpsee = { version = "0.24", features = ["server"] }
sc-rpc = "37"
substrate-frame-rpc-system = "36"
pallet-transaction-payment-rpc = "38"

# Runtime
chameleon-runtime = { path = "../runtime-standalone" }

[build-dependencies]
substrate-build-script-utils = "11"

[features]
default = []
runtime-benchmarks = [
    "chameleon-runtime/runtime-benchmarks",
]
