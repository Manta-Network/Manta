[package]
name = "pallet-chameleon-staking"
version = "0.1.0"
edition = "2021"
description = "Chameleon Network enhanced staking pallet with delegation and reward optimization."
license = "GPL-3.0"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_cfg"]

[features]
default = ["std"]

runtime-benchmarks = [
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
]

try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",
]

std = [
  "frame-benchmarking?/std",
  "frame-support/std",
  "frame-system/std",
  "codec/std",
  "scale-info/std",
  "sp-runtime/std",
  "sp-std/std",
]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.0", default-features = false, features = ["derive"] }
scale-info = { version = "2.10", default-features = false, features = ["derive"] }
frame-benchmarking = { version = "4.0.0-dev", default-features = false, optional = true, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
frame-support = { version = "4.0.0-dev", default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
frame-system = { version = "4.0.0-dev", default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
sp-runtime = { version = "24.0.0", default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
sp-std = { version = "8.0.0", default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }

[dev-dependencies]
sp-core = { version = "21.0.0", features = ["std"], git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
sp-io = { version = "23.0.0", features = ["std"], git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
pallet-balances = { version = "4.0.0-dev", features = ["std"], git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
frame-system = { version = "4.0.0-dev", features = ["std"], git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.1.0" }
